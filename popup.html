<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-header">
    <h1>Word Definer AI</h1>
    <button id="toggle-btn" class="toggle-off" title="Toggle double-click lookup on/off">OFF</button>
  </div>

  <!-- Word & Context Lookup Section -->
  <div class="lookup-section">
    <label for="word-input">Target Word / Phrase:</label>
    <div class="input-row">
      <input type="text" id="word-input" placeholder="Type or paste word…" autocomplete="off" spellcheck="false">
      <button id="lookup-btn">Define</button>
    </div>

    <label for="context-input" style="font-size: 11px; color: #a6adc8; display: block; margin-top: 10px; margin-bottom: 4px;">
      Full Sentence / Context (Optional):
    </label>
    <textarea id="context-input" rows="3" placeholder="Paste the full sentence or line here for AI context…" style="width: 100%; box-sizing: border-box; resize: vertical; border-radius: 6px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; padding: 6px; font-family: inherit; font-size: 12px;"></textarea>

    <p class="hint" style="margin-top: 6px;">Useful for PDFs and offline files where double-click isn't active.</p>
  </div>

  <!-- Settings Section for Gemini API Key -->
  <div class="settings-section" style="margin-top: 12px; padding-top: 10px; border-top: 1px solid #45475a;">
    <label for="api-key-input" style="font-size: 11px; color: #a6adc8; display: block; margin-bottom: 4px;">Gemini API Key (for AI Context):</label>
    <div class="input-row">
      <input type="password" id="api-key-input" placeholder="Paste AI Studio Key…" autocomplete="off">
      <button id="save-key-btn" style="background: #a6e3a1; color: #11111b;">Save</button>
    </div>
    <p id="key-status" class="hint" style="color: #a6e3a1; margin-top: 4px; display: none;">Key saved locally!</p>
  </div>

  <!-- Result Container -->
  <div id="result" class="result hidden" style="margin-top: 10px;"></div>

  <script src="popup.js"></script>
</body>
</html>
